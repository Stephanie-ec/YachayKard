<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:pt="jakarta.faces.passthrough">
<h:head>
    <meta charset="UTF-8"/>
    <title>Iniciar sesión - YachayKard</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</h:head>
<h:body styleClass="bg-light">

    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-sm-8 col-md-5 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 text-center mb-1">YachayKard</h1>
                        <p class="text-center text-muted mb-4">Sistema de gestión escolar</p>

                        <h:messages styleClass="list-unstyled" errorClass="alert alert-danger"/>

                        <h:form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label" for="usuario">Usuario</label>
                                <h:inputText id="usuario" value="#{loginBean.username}" styleClass="form-control"
                                             required="true" requiredMessage="Ingrese su usuario."
                                             pt:autofocus="autofocus"/>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="clave">Contraseña</label>
                                <h:inputSecret id="clave" value="#{loginBean.password}" styleClass="form-control"
                                               required="true" requiredMessage="Ingrese su contraseña."/>
                            </div>
                            <h:commandButton value="Ingresar" action="#{loginBean.ingresar}"
                                             styleClass="btn btn-primary w-100"/>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</h:body>
</html>
