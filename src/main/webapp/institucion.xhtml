<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:pt="jakarta.faces.passthrough">
<ui:composition template="/WEB-INF/templates/template.xhtml">

    <ui:define name="titulo">Datos de la institución - YachayKard</ui:define>

    <ui:define name="contenido">
        <h2 class="mb-3">Datos de la institución</h2>

        <h:messages styleClass="list-unstyled" infoClass="alert alert-success" errorClass="alert alert-danger"/>

        <div class="card">
            <div class="card-body">
                <h:form id="formInstitucion">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <h:outputLabel for="nombreInstitucion" value="Nombre de la institución *" styleClass="form-label"/>
                            <h:inputText id="nombreInstitucion" value="#{institucionBean.institucion.nombre}" styleClass="form-control"
                                         required="true" requiredMessage="El nombre es obligatorio."/>
                        </div>
                        <div class="col-md-2">
                            <h:outputLabel for="codigoModular" value="Código modular *" styleClass="form-label"/>
                            <h:inputText id="codigoModular" value="#{institucionBean.institucion.codigoModular}" styleClass="form-control"
                                         pt:maxlength="7" pt:placeholder="7 dígitos"
                                         required="true" requiredMessage="El código modular es obligatorio."/>
                        </div>
                        <div class="col-md-2">
                            <h:outputLabel for="nivel" value="Nivel *" styleClass="form-label"/>
                            <h:selectOneMenu id="nivel" value="#{institucionBean.institucion.nivel}" styleClass="form-select"
                                             required="true" requiredMessage="Seleccione el nivel.">
                                <f:selectItems value="#{institucionBean.niveles}"/>
                            </h:selectOneMenu>
                        </div>

                        <div class="col-md-6">
                            <h:outputLabel for="director" value="Director(a)" styleClass="form-label"/>
                            <h:inputText id="director" value="#{institucionBean.institucion.nombreDirector}" styleClass="form-control"/>
                        </div>
                        <div class="col-md-6">
                            <h:outputLabel for="direccion" value="Dirección" styleClass="form-label"/>
                            <h:inputText id="direccion" value="#{institucionBean.institucion.direccion}" styleClass="form-control"/>
                        </div>

                        <div class="col-md-4">
                            <h:outputLabel for="departamento" value="Departamento" styleClass="form-label"/>
                            <h:inputText id="departamento" value="#{institucionBean.institucion.departamento}" styleClass="form-control"/>
                        </div>
                        <div class="col-md-4">
                            <h:outputLabel for="provincia" value="Provincia" styleClass="form-label"/>
                            <h:inputText id="provincia" value="#{institucionBean.institucion.provincia}" styleClass="form-control"/>
                        </div>
                        <div class="col-md-4">
                            <h:outputLabel for="distrito" value="Distrito" styleClass="form-label"/>
                            <h:inputText id="distrito" value="#{institucionBean.institucion.distrito}" styleClass="form-control"/>
                        </div>

                        <div class="col-md-4">
                            <h:outputLabel for="telefono" value="Teléfono" styleClass="form-label"/>
                            <h:inputText id="telefono" value="#{institucionBean.institucion.telefono}" styleClass="form-control"
                                         pt:maxlength="15"/>
                        </div>
                        <div class="col-md-8">
                            <h:outputLabel for="correoElectronico" value="Correo electrónico" styleClass="form-label"/>
                            <h:inputText id="correoElectronico" value="#{institucionBean.institucion.correoElectronico}" styleClass="form-control"
                                         pt:type="email"/>
                        </div>
                    </div>

                    <div class="mt-4">
                        <h:commandButton value="Guardar cambios" action="#{institucionBean.guardar}"
                                         styleClass="btn btn-primary"/>
                    </div>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
</html>
